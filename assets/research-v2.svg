<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: none; }
    .card-border-1 { stroke: #8A2BE2; stroke-width: 1.5; fill: none; }
    .card-border-2 { stroke: #0078D4; stroke-width: 1.5; fill: none; }
    .card-border-3 { stroke: #2E8B57; stroke-width: 1.5; fill: none; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
    .desc  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
    @media (prefers-color-scheme: light) {
      .desc { fill: #57606a; }
    }
    @media (prefers-color-scheme: dark) {
      .desc { fill: #8b949e; }
    }
  </style>

  <!-- Card 1: Long-Horizon SWE Agents -->
  <rect class="card-border-2" x="2" y="2" width="210" height="136" rx="10"/>
  <text class="title" x="107" y="42" text-anchor="middle" fill="#0078D4">Long-Horizon SWE Agents</text>
  <text class="desc"  x="107" y="66" text-anchor="middle">Multimodal coding tasks</text>
  <text class="desc"  x="107" y="84" text-anchor="middle">from scratch to tested,</text>
  <text class="desc"  x="107" y="102" text-anchor="middle">deployable software</text>

  <!-- Card 2: GUI & Web Agent -->
  <rect class="card-border-3" x="230" y="2" width="210" height="136" rx="10"/>
  <text class="title" x="335" y="42" text-anchor="middle" fill="#2E8B57">GUI &amp; Web Agent</text>
  <text class="desc"  x="335" y="66" text-anchor="middle">Agents that navigate</text>
  <text class="desc"  x="335" y="84" text-anchor="middle">real interfaces and</text>
  <text class="desc"  x="335" y="102" text-anchor="middle">the open web</text>

  <!-- Card 3: Multimodal Retrieval -->
  <rect class="card-border-2" x="458" y="2" width="210" height="136" rx="10"/>
  <text class="title" x="563" y="42" text-anchor="middle" fill="#0078D4">Multimodal Retrieval</text>
  <text class="desc"  x="563" y="66" text-anchor="middle">RAG over text, image,</text>
  <text class="desc"  x="563" y="84" text-anchor="middle">documents, and beyond</text>
  <text class="desc"  x="563" y="102" text-anchor="middle">with RAGLAB</text>

  <!-- Card 4: Proactive Agent -->
  <rect class="card-border-1" x="686" y="2" width="210" height="136" rx="10"/>
  <text class="title" x="791" y="42" text-anchor="middle" fill="#8A2BE2">Proactive Agent</text>
  <text class="desc"  x="791" y="66" text-anchor="middle">Understanding human intent</text>
  <text class="desc"  x="791" y="84" text-anchor="middle">and acting before</text>
  <text class="desc"  x="791" y="102" text-anchor="middle">being asked</text>
</svg>
